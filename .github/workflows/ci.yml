name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEARANCE_MODE: simulated
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production console
        run: npm run build
      - name: Enforce bundle budget
        run: node src/cli/clearance.ts budget dist/web
      - name: Check documentation links
        run: node src/cli/clearance.ts doccheck
      - name: Smoke-test HTTP and MCP endpoints
        run: npm run test:smoke
